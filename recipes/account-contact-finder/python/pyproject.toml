[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-account-contact-finder"
version = "0.1.0"
description = "gtm-starter-kit recipe: account-contact-finder."
requires-python = ">=3.11"
dependencies = ["firmable-gtm-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtm-account-contact-finder = "account_contact_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
