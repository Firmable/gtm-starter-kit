[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-inbound-lead-router"
version = "0.1.0"
description = "gtm-starter-kit recipe: enrich and route an inbound lead from a work email or domain with explicit rules."
requires-python = ">=3.11"
dependencies = ["firmable-gtm-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtm-inbound-lead-router = "inbound_lead_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
