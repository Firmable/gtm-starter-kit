[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-duplicate-account-review"
version = "0.1.0"
description = "gtm-starter-kit recipe: duplicate-account-review."
requires-python = ">=3.11"
dependencies = ["firmable-gtm-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtm-duplicate-account-review = "duplicate_account_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
