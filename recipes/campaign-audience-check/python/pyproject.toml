[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-campaign-audience-check"
version = "0.1.0"
description = "gtm-starter-kit recipe: check accounts against a campaign audience with Firmable Decisions."
requires-python = ">=3.11"
dependencies = ["firmable-gtm-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtm-campaign-audience-check = "campaign_audience_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
