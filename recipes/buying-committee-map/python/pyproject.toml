[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-buying-committee-map"
version = "0.1.0"
description = "gtm-starter-kit recipe: map decision makers by department and seniority at each account and show gaps."
requires-python = ">=3.11"
dependencies = ["firmable-gtm-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtm-buying-committee-map = "buying_committee_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
